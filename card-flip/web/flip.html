<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDE Card Flip</title>
<style>
  :root { --navy: #050a17; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #16233f 0%, var(--navy) 70%);
    display: grid; place-items: center; overflow: hidden;
  }
  .scene { perspective: 1200px; }
  .card {
    position: relative;
    width: min(64vw, 460px);
    aspect-ratio: 5 / 7;
    transform-style: preserve-3d;
    animation: flip 5s cubic-bezier(0.4, 0, 0.2, 1) both;
    cursor: pointer;
  }
  .card.replay { animation: none; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 4.5% / 3.2%;
    background-size: cover;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .65);
  }
  .front { background-image: url("../assets/card-front.png"); }
  .back  { background-image: url("../assets/card-back.png"); transform: rotateY(180deg); }
  @keyframes flip {
    0%, 30%   { transform: rotateY(0deg) scale(1); }
    36%       { transform: rotateY(38deg) scale(1.03); }
    44%       { transform: rotateY(90deg) scale(1.04); }
    52%       { transform: rotateY(142deg) scale(1.03); }
    58%, 100% { transform: rotateY(180deg) scale(1); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>
  <script>
    // click to replay
    const card = document.getElementById('card');
    card.addEventListener('click', () => {
      card.classList.add('replay');
      void card.offsetWidth;          // restart the animation
      card.classList.remove('replay');
    });
  </script>
</body>
</html>
